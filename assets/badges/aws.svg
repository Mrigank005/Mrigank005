<svg width="80" height="32" viewBox="0 0 80 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with M3 style -->
  <rect width="80" height="32" rx="16" fill="#FFCC80"/>
  
  <!-- Subtle shadow effect -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon circle (simplified) -->
  <circle cx="16" cy="16" r="6" fill="white" opacity="0.3"/>
  <circle cx="16" cy="16" r="4" fill="white"/>
  
  <!-- Text -->
  <text x="30" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="white" letter-spacing="-0.01em">AWS</text>
</svg>